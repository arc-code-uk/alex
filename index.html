<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>alexitbb | Links</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: white;
    background: #080808;

    overflow-x: hidden;
}


/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(0,0,0,0.50),
            rgba(0,0,0,0.82)
        ),
        url("background.jpg");

    background-size: cover;
    background-position: center;

    z-index: -2;
}


/* BLUR */

.background::after {
    content: "";

    position: absolute;
    inset: 0;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}


/* MAIN */

.container {
    width: 100%;
    max-width: 600px;

    margin: auto;

    padding: 55px 20px 40px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* PROFILE */

.profile {
    text-align: center;

    animation: fadeDown 0.8s ease;
}

.profile-image {
    width: 110px;
    height: 110px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,0.9);

    box-shadow:
        0 0 0 6px rgba(255,255,255,0.08),
        0 20px 50px rgba(0,0,0,0.5);

    margin-bottom: 18px;
}

.name {
    font-size: 30px;
    font-weight: 700;

    letter-spacing: -0.8px;
}

.username {
    margin-top: 5px;

    color: rgba(255,255,255,0.6);

    font-size: 14px;
}

.bio {
    margin-top: 14px;

    color: rgba(255,255,255,0.85);

    font-size: 15px;

    line-height: 1.5;
}


/* LINKS CONTAINER */

.links {
    width: 100%;

    margin-top: 35px;

    display: flex;
    flex-direction: column;

    gap: 15px;
}


/* INDIVIDUAL BLOCK */

.link {
    width: 100%;
    min-height: 72px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    text-decoration: none;
    color: white;

    border-radius: 18px;

    /* Glass effect */

    background: rgba(255,255,255,0.10);

    border: 1px solid rgba(255,255,255,0.17);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.25);

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;

    animation: fadeUp 0.7s ease forwards;

    opacity: 0;
}


/* ANIMATION DELAYS */

.link:nth-child(1) {
    animation-delay: 0.10s;
}

.link:nth-child(2) {
    animation-delay: 0.18s;
}

.link:nth-child(3) {
    animation-delay: 0.26s;
}

.link:nth-child(4) {
    animation-delay: 0.34s;
}

.link:nth-child(5) {
    animation-delay: 0.42s;
}

.link:nth-child(6) {
    animation-delay: 0.50s;
}


/* HOVER */

.link:hover {
    transform: translateY(-4px);

    background: rgba(255,255,255,0.17);

    border-color:
        rgba(255,255,255,0.30);

    box-shadow:
        0 18px 45px rgba(0,0,0,0.35);
}


/* ICON */

.icon {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        rgba(255,255,255,0.12);

    font-size: 20px;

    margin-right: 16px;
}


/* TEXT */

.link-text {
    flex: 1;
}

.link-title {
    font-size: 16px;

    font-weight: 600;
}

.link-subtitle {
    margin-top: 3px;

    font-size: 12px;

    color:
        rgba(255,255,255,0.55);
}


/* ARROW */

.arrow {
    font-size: 26px;

    color:
        rgba(255,255,255,0.55);

    transition:
        transform 0.25s ease;
}

.link:hover .arrow {
    transform: translateX(5px);

    color: white;
}


/* FOOTER */

.footer {
    margin-top: 35px;

    color:
        rgba(255,255,255,0.4);

    font-size: 12px;
}


/* ANIMATIONS */

@keyframes fadeDown {

    from {
        opacity: 0;
        transform: translateY(-20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* MOBILE */

@media (max-width: 500px) {

    .container {
        padding: 40px 15px 30px;
    }

    .profile-image {
        width: 95px;
        height: 95px;
    }

    .name {
        font-size: 26px;
    }

    .link {
        min-height: 68px;

        border-radius: 16px;

        padding: 0 16px;
    }

}

</style>
